plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'com.google.devtools.ksp'
    id 'dagger.hilt.android.plugin'
    id 'com.google.gms.google-services'  // Required for google-services.json
}

android {
    namespace 'com.smartexpenseai.app'
    compileSdk 36

    defaultConfig {
        applicationId "com.smartexpenseai.app"
        minSdk 24
        targetSdk 36

        // Automatic versioning derived from Git commit count.
        // Every commit bumps versionCode and versionName with zero manual work.
        // Only bump VERSION_BASE below for a major/minor release (e.g. "2.0").
        def VERSION_BASE = "3.0"
        def gitCommitCount = 101  // fallback if git is unavailable

        try {
            def countResult = 'git rev-list --count HEAD'.execute()
            countResult.waitFor()
            if (countResult.exitValue() == 0) {
                gitCommitCount = Integer.parseInt(countResult.text.trim())
            }
        } catch (Exception e) {
            println "Warning: Git version detection failed, using fallback versionCode ${gitCommitCount}"
        }

        // CI/local release builds can select the next unused Play version code with
        // -PbuildNumber=<number>. Normal builds continue to use the Git commit count.
        def buildNumber = project.findProperty("buildNumber")?.toString()?.toInteger() ?: gitCommitCount
        def gitVersionName = "${VERSION_BASE}.${buildNumber}"

        versionCode buildNumber
        versionName gitVersionName

        testInstrumentationRunner "com.smartexpenseai.app.HiltTestRunner"

        println "Building version ${gitVersionName} (code: ${buildNumber})"
    }

    def releaseKeystorePath = project.findProperty("SMART_EXPENSE_KEYSTORE_PATH") ?: System.getenv("SMART_EXPENSE_KEYSTORE_PATH")
    def releaseStorePassword = project.findProperty("SMART_EXPENSE_STORE_PASSWORD") ?: System.getenv("SMART_EXPENSE_STORE_PASSWORD")
    def releaseKeyAlias = project.findProperty("SMART_EXPENSE_KEY_ALIAS") ?: System.getenv("SMART_EXPENSE_KEY_ALIAS")
    def releaseKeyPassword = project.findProperty("SMART_EXPENSE_KEY_PASSWORD") ?: System.getenv("SMART_EXPENSE_KEY_PASSWORD")

    signingConfigs {
        if (releaseKeystorePath && releaseStorePassword && releaseKeyAlias && releaseKeyPassword) {
            release {
                storeFile file(releaseKeystorePath)
                storePassword releaseStorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
            }
        }
    }

    buildTypes {
        debug {
            // Mock mode enabled for development - bypasses authentication and subscription
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'

            // Production mode - uses real Google Sign-In and Billing
            buildConfigField "boolean", "MOCK_AUTH", "false"
            buildConfigField "boolean", "MOCK_SUBSCRIPTION", "false"
            buildConfigField "String", "BUILD_TYPE_NAME", '"Debug"'
        }

        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            def configuredReleaseSigning = signingConfigs.findByName("release")
            if (configuredReleaseSigning != null) {
                signingConfig configuredReleaseSigning
            }

            // Production mode - uses real Google Sign-In and Billing
            buildConfigField "boolean", "MOCK_AUTH", "false"
            buildConfigField "boolean", "MOCK_SUBSCRIPTION", "false"
            buildConfigField "String", "BUILD_TYPE_NAME", '"Release"'
        }
    }
    
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    
    kotlinOptions {
        jvmTarget = '1.8'
    }
    
    
    buildFeatures {
        viewBinding true
        buildConfig true
    }
}

configurations.all {
    resolutionStrategy.eachDependency { details ->
        if (details.requested.group == "com.google.protobuf") {
            details.useVersion "3.24.4"
            details.because("Align protobuf with Android test runner expectations to avoid class verification issues")
        }
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    
    // Navigation
    implementation 'androidx.navigation:navigation-fragment-ktx:2.7.4'
    implementation 'androidx.navigation:navigation-ui-ktx:2.7.4'
    
    // ViewModel and LiveData
    implementation 'androidx.lifecycle:lifecycle-viewmodel-ktx:2.7.0'
    implementation 'androidx.lifecycle:lifecycle-livedata-ktx:2.7.0'
    
    // Coroutines
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'
    
    // Room database dependencies
    implementation 'androidx.room:room-runtime:2.5.0'
    implementation 'androidx.room:room-ktx:2.5.0'
    implementation 'com.google.firebase:firebase-auth:22.3.1'  // Compatible with Kotlin 1.9
    implementation 'androidx.credentials:credentials:1.3.0'
    implementation 'androidx.credentials:credentials-play-services-auth:1.3.0'
    implementation 'com.google.android.libraries.identity.googleid:googleid:1.1.1'
    ksp 'androidx.room:room-compiler:2.5.0'
    
    // Charts
    implementation 'com.github.PhilJay:MPAndroidChart:v3.1.0'
    
    // Permissions
    implementation 'com.karumi:dexter:6.2.3'
    
    // SwipeRefreshLayout
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
    
    // Network dependencies for AI Insights
    implementation 'com.squareup.retrofit2:retrofit:2.9.0'
    implementation 'com.squareup.retrofit2:converter-gson:2.9.0'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'com.squareup.okhttp3:logging-interceptor:4.12.0'
    implementation 'com.google.code.gson:gson:2.10.1'
    
    // Shimmer loading effect
    implementation 'com.facebook.shimmer:shimmer:0.5.0'

    // Hilt Dependency Injection
    implementation 'com.google.dagger:hilt-android:2.48'
    ksp 'com.google.dagger:hilt-compiler:2.48'

    // Google Sign-In
    implementation 'com.google.android.gms:play-services-auth:20.7.0'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-play-services:1.7.3'

    // Keep Timber for now during migration (will be removed later)
    implementation 'com.jakewharton.timber:timber:5.0.1'
    
    // Testing
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'io.mockk:mockk:1.12.0'
    testImplementation 'org.jetbrains.kotlinx:kotlinx-coroutines-test:1.7.3'
    testImplementation 'androidx.arch.core:core-testing:2.2.0'
    testImplementation 'com.google.dagger:hilt-android-testing:2.48'
    testImplementation 'androidx.room:room-testing:2.5.0'
    kspTest 'com.google.dagger:hilt-compiler:2.48'
    
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
    androidTestImplementation 'androidx.test.espresso:espresso-intents:3.5.1'
    androidTestImplementation 'com.google.dagger:hilt-android-testing:2.48'
    kspAndroidTest 'com.google.dagger:hilt-compiler:2.48'
}

// Task to print current version
task printVersion {
    doLast {
        def VERSION_BASE = "3.0"
        def vCode = 101
        try {
            def countResult = 'git rev-list --count HEAD'.execute()
            countResult.waitFor()
            if (countResult.exitValue() == 0) {
                vCode = Integer.parseInt(countResult.text.trim())
            }
        } catch (Exception e) {
            println "Warning: Could not get Git version"
        }
        def vName = "${VERSION_BASE}.${vCode}"

        println "============================================"
        println "App Version Information"
        println "============================================"
        println "Version Name: ${vName}"
        println "Version Code: ${vCode}"
        println "Git Commits:  ${vCode}"
        println "============================================"
    }
}
